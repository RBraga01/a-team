name: HOL Plugin Scanner

on:
  pull_request:
    branches: [main]
    paths:
      - 'plugin.json'
      - '.codex-plugin/**'
      - '.claude-plugin/**'
      - '.agents/**'
      - 'skills/**'
      - 'agents/**'
      - '.claude/agents/**'
      - 'scripts/**'
      - 'hooks/**'
      - 'tests/**'
      - 'install.sh'
      - 'install.ps1'
      - 'SECURITY.md'
      - '.github/workflows/**'
  push:
    branches: [main]
  workflow_dispatch:

# Scanner is third-party code. Do not grant write access, submission tokens,
# repository secrets, or permission to post outside the repository.
permissions:
  contents: read

jobs:
  hol-scan:
    name: Security & marketplace readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: HOL AI Plugin Scanner (offline)
        id: scanner
        uses: hashgraph-online/ai-plugin-scanner-action@caba2e96aa8ad2feb6cf6fca52442b52e22e779f # v1.2.635
        with:
          plugin_dir: "."
          mode: scan
          profile: public-marketplace
          min_score: 80
          fail_on_severity: high
          format: json
          output: hol-scan-report.json
          online: false
          install_cisco: false
          submission_enabled: false
          pr_comment: off
          upload_sarif: false

      - name: Publish evidence artifact (including failure cases)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hol-security-scan
          path: hol-scan-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: State scanner limits
        if: always()
        run: |
          {
            echo '### HOL source-repository scan'
            echo 'Offline third-party scanner; no OAuth, external submission, or Cisco analyzer enabled.'
            echo 'Passing does **not** certify software safety or update the HOL central registry automatically.'
            echo 'The catalog must independently rescan the current source for its normalized trust score.'
          } >> "$GITHUB_STEP_SUMMARY"
