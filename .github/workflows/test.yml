name: A Team Tests

on:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - 'skills/**'
      - '.claude/agents/**'
      - '.claude/rules/**'
      - 'tests/**'
      - 'scripts/**'
      - 'install.sh'
      - 'install.ps1'
      - '.claude-plugin/**'
      - '.codex-plugin/**'
      - '.cursor-plugin/**'
      - '.copilot-plugin/**'
      - '.opencode/**'
      - 'assets/**'
      - 'README.md'
      - 'plugin.json'
      - 'hooks/**'
      - 'docs/installation.md'
      - 'docs/installation.md'
      - '.github/workflows/test.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Test mode (replay uses saved transcripts; record runs live sessions)'
        required: true
        default: 'replay'
        type: choice
        options: [replay, record]

jobs:
  # ── Unit tests (offline, no API key needed) ─────────────────────────────────
  unit-tests:
    name: Unit Tests (parser + assertions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Run parser unit tests
        working-directory: tests
        run: node --test lib/transcript-parser.test.js

      - name: Run assertion unit tests
        working-directory: tests
        run: node --test lib/assertions.test.js

      - name: Check manifests and Bash installation
        working-directory: tests
        run: node --test lib/plugin-manifests.test.js lib/installers.test.js lib/opencode-commands.test.js

  # ── OpenCode native command discovery (no model or API key) ───────────────
  opencode-discovery:
    name: OpenCode CLI command discovery (no API)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install official OpenCode CLI (no API key)
        run: npm install --global @opencode/cli
      - name: Check native custom-command loading via local API
        env:
          OPENCODE_SERVER_PASSWORD: ci-only-local-test
        run: |
          opencode --version
          opencode serve --hostname 127.0.0.1 --port 41873 > "$RUNNER_TEMP/opencode-server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 25); do
            if curl --silent --show-error --fail --user opencode:ci-only-local-test \
              --get --data-urlencode "location[directory]=$GITHUB_WORKSPACE" \
              http://127.0.0.1:41873/api/command > "$RUNNER_TEMP/opencode-commands.json" 2>/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/opencode-server.log"
            exit 1
          fi
          node tests/verify-opencode-host.mjs "$RUNNER_TEMP/opencode-commands.json"

  # ── Validate the Windows PowerShell installer on Windows ───────────────────
  installer-windows:
    name: Installer smoke (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Run installer smoke tests
        working-directory: tests
        run: node --test lib/installers.test.js

  # ── Integration tests (replay mode — uses committed transcripts) ─────────────
  integration-tests-replay:
    name: Integration Tests (replay)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Check for saved transcripts
        id: check
        run: |
          count=$(find tests/transcripts -name '*.jsonl' 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Run all suites in replay mode
        if: steps.check.outputs.count != '0'
        working-directory: tests
        env:
          TEST_MODE: replay
        run: node runner.js

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-${{ github.sha }}
          path: tests/reports/
          retention-days: 30

  # ── Integration tests (record mode — runs live sessions, costs $) ─────────────
  integration-tests-record:
    name: Integration Tests (record live sessions)
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event.inputs.mode == 'record'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Record sessions and run assertions
        working-directory: tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEST_MODE: record
        run: node runner.js --record

      - name: Upload recorded transcripts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: transcripts-${{ github.sha }}
          path: tests/transcripts/
          retention-days: 90

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-record-${{ github.sha }}
          path: tests/reports/
          retention-days: 30
